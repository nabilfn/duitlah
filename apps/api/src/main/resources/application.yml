spring:
  application:
    name: duitlah-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:duitlah}
    username: ${DB_USER:duitlah}
    password: ${DB_PASSWORD:duitlah}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

duitlah:
  frontend-url: ${FRONTEND_URL:http://localhost:3001}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3001}
  auth:
    # Dev-only default — every deployed environment MUST override this via
    # JWT_SECRET with a random value (e.g. `openssl rand -base64 48`).
    # HS256 requires at least 256 bits; this default is intentionally
    # unfit for anything but a local sandbox.
    jwt-secret: ${JWT_SECRET:dev-only-insecure-secret-do-not-use-in-production-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
    refresh-cookie:
      name: duitlah_refresh_token
      same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}
      secure: ${REFRESH_COOKIE_SECURE:false}
      domain: ${REFRESH_COOKIE_DOMAIN:}
  storage:
    # Points at the MinIO container locally (S3-compatible); swap in a real AWS S3
    # bucket or Supabase Storage's S3-compatible endpoint in production — nothing
    # above ObjectStorage needs to change. path-style-access must stay true for
    # MinIO; a real AWS bucket typically wants it false.
    endpoint: ${S3_ENDPOINT:http://minio:9000}
    # What a browser (running on the host, not in the Compose network) can actually
    # reach — used only for signing presigned URLs, never for the API's own S3 calls.
    public-endpoint: ${S3_PUBLIC_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:duitlah-receipts}
    access-key: ${S3_ACCESS_KEY:duitlah}
    secret-key: ${S3_SECRET_KEY:duitlah-dev-secret}
    path-style-access: ${S3_PATH_STYLE_ACCESS:true}
  receipts:
    ocr:
      # Left unset by default: OCR is unavailable and every scan falls back to
      # manual entry (see receipts.UnavailableOcrService) until a real key is
      # configured — the same "optional external provider" posture as SMTP.
      anthropic-api-key: ${ANTHROPIC_API_KEY:}
      model: ${ANTHROPIC_OCR_MODEL:claude-sonnet-5}
  ai:
    chat:
      # Same key as receipts.ocr above (one Anthropic account, two features) --
      # left unset by default: the AI assistant is unavailable and every
      # request gets ai.UnavailableAiChatService's fixed reply until a real
      # key is configured.
      anthropic-api-key: ${ANTHROPIC_API_KEY:}
      model: ${ANTHROPIC_AI_MODEL:claude-sonnet-5}

logging:
  level:
    com.duitlah: INFO
